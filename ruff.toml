# Committed ruff config for the Python flavour of kicad-cli.
#
# REPO-SPEC §6 requires the formatter config to live in the repo (not only in CI
# defaults) so local `ruff check` / `ruff format` match what CI enforces.
# ruff is used for both linting and formatting; no separate black/isort needed.

line-length = 100
target-version = "py310"

[lint]
# E/F: pycodestyle + pyflakes (core correctness + style)
# I:   import sorting (isort)
# UP:  pyupgrade — keep syntax modern for the target version
# B:   flake8-bugbear — catch likely bugs and footguns
select = ["E", "F", "I", "UP", "B"]

[lint.per-file-ignores]
# The routing, stitching and widening payloads came in whole from the layout
# skill, where they were tuned against a real four-layer board until DRC was
# clean. Their %-formatted log lines are a style preference, and rewriting
# eighteen of them inside a thousand-line geometry solver buys nothing and
# risks a typo in code that is hard to test and expensive to get wrong. The
# rules that can hide a defect -- zip truncation, unused loop variables,
# ambiguous names -- were fixed rather than silenced.
"kicad_cli/payload/pcb_*.py" = ["UP031"]
"kicad_cli/payload/plane.py" = ["UP031"]
"kicad_cli/payload/router.py" = ["UP031"]

[format]
# Defaults: double quotes, space indentation, auto line endings.
quote-style = "double"
indent-style = "space"
