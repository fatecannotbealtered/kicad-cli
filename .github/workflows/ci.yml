# The merge gate (DREPO-041): every change passes these checks on every shipped system before
# it merges. The release workflow runs the same checks before it publishes.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  systems:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: matrix
        name: The shipped systems, from the platform packages in package.json
        run: python3 scripts/platforms.py systems >> "$GITHUB_OUTPUT"

  gate:
    needs: systems
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.systems.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install the locked development dependencies
        run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Project check
        run: python scripts/spec.py check
      - name: Conformance suites, with the output size check (R04)
        run: python scripts/spec.py suites
      - name: Build the native program and the platform package
        run: python scripts/build.py
      - name: Pack the npm packages and check their content
        run: python scripts/pack.py

  # The one required status check: it fails unless every check passed on every shipped system,
  # also when a job before it failed or was skipped.
  passed:
    name: merge gate passed
    needs: [systems, gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        run: test "${{ needs.systems.result }}" = success && test "${{ needs.gate.result }}" = success
