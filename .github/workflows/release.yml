# The release (DREPO-043): started only by pushing an annotated tag vX.Y.Z that equals the
# version in package.json. It runs the merge gate and platform delivery for every platform
# package, and publishes nothing unless both pass for every one of them; then it publishes
# every package to npm with provenance (DSEC-071).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      systems: ${{ steps.systems.outputs.matrix }}
      packages: ${{ steps.packages.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag is annotated and equals package.json
        run: |
          version=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} is not v${version}"; exit 1; }
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          test "$(git cat-file -t "${GITHUB_REF_NAME}")" = "tag" || { echo "the tag is not annotated"; exit 1; }
      - id: systems
        run: python3 scripts/platforms.py systems >> "$GITHUB_OUTPUT"
      - id: packages
        run: python3 scripts/platforms.py packages >> "$GITHUB_OUTPUT"
      - name: The release notes come from CHANGELOG.md
        run: python3 scripts/release_gate.py --notes
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Pack the main package once; every platform delivers this same tarball
        run: python3 scripts/pack.py --main
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: main-package
          path: dist/*.tgz

  gate:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.systems) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install the locked development dependencies
        run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/spec.py check
      - run: python scripts/spec.py suites

  delivery:
    needs: [prepare, gate]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.packages) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: main-package
          path: dist
      - name: Build the native program and the platform package
        if: matrix.os != 'linux'
        run: python scripts/build.py
      - name: Build the native program on Debian 11 (glibc 2.31), so it runs on older Linux systems too
        if: matrix.os == 'linux'
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" -w /work
          python:3.12-bullseye@sha256:7cc929040c5e8cf6036c5099d62a83708427c131fb7a7c965b5ba51e995eea1c
          sh -c "python -m pip install --user --require-hashes --no-deps -r requirements-dev.txt && python scripts/build.py"
      - name: Pack and check the platform package
        run: python scripts/pack.py --platform
      - name: Platform delivery, from a clean npm prefix
        run: python scripts/smoke.py --fake-host
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: delivery-${{ matrix.os }}-${{ matrix.cpu }}
          path: |
            dist/*-${{ matrix.os }}-${{ matrix.cpu }}-*.tgz
            dist/delivery-*.json

  publish:
    needs: [prepare, delivery]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Every platform package passed platform delivery
        run: python3 scripts/release_gate.py artifacts
      - name: Publish the platform packages, then the main package, with provenance
        # Trusted publishing when the package has it set up on npmjs.com, otherwise the NPM_TOKEN secret.
        # A prerelease goes to the npm tag next, so that update does not install it by default.
        run: |
          case "${GITHUB_REF_NAME}" in *-*) tag=next ;; *) tag=latest ;; esac
          for tarball in $(python3 scripts/release_gate.py artifacts --order); do
            npm publish "$tarball" --provenance --access public --tag "$tag"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release with the notes from CHANGELOG.md
        run: |
          case "${GITHUB_REF_NAME}" in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "${GITHUB_REF_NAME}" --verify-tag $pre --notes "$(python3 scripts/release_gate.py --notes)"
        env:
          GH_TOKEN: ${{ github.token }}
